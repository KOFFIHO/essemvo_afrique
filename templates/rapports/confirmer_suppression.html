{% extends "rapports/base.html" %}
{% block titre %}Confirmer la suppression{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-argile p-4 text-center">
            <i class="bi bi-exclamation-triangle text-danger fs-1 mb-2"></i>
            <h4>Supprimer « {{ objet }} » ?</h4>
            <p class="text-muted">Cette action est définitive.</p>
            <form method="post" class="d-flex justify-content-center gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Supprimer</button>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
