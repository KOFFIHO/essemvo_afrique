{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ESSEMVO AFRIQUE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/argile.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h1 class="h3" style="color: var(--argile-vert-fonce);">🌿 ESSEMVO AFRIQUE</h1>
            <p class="text-muted">La Mémoire du Fermier — Poules Pondeuses</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger">Identifiants incorrects. Réessayez.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-argile w-100">Se connecter</button>
        </form>
    </div>
</div>
</body>
</html>
